---
# ShieldOps Ansible Deployment Playbook
# Triggered by GitHub Actions after Terraform Apply

- name: ShieldOps Deployment
  hosts: deployment_servers
  become: yes
  vars_files:
    - ../vars/main.yml

  tasks:
    - name: Prepare deployment directories
      file:
        path: "{{ item }}"
        state: directory
        mode: '0775'
      with_items:
        - /var/softwares
        - /var/softwares/ShieldOps1.0_deployment

    - name: Install monitoring agents
      include_role:
        name: monitoring-agents

    - name: Download artifacts from Nexus
      include_role:
        name: nexus-artifacts

    - name: Deploy TLS certificates
      include_role:
        name: tls-certs

    - name: Configure NGINX and Firewall
      include_role:
        name: nginx-config

    - name: Kubernetes Bootstrap
      include_role:
        name: k8s-bootstrap

    - name: Deploy Manifests via Helm
      include_role:
        name: helm-deploy
