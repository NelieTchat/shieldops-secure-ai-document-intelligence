# ShieldOps — Fluent Bit Log Collection
# Collects logs from all shieldops namespace pods
# Forwards to CloudWatch Logs → OpenSearch

[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info

[INPUT]
    Name              tail
    Tag               shieldops.*
    Path              /var/log/containers/*shieldops*.log
    Parser            docker
    Refresh_Interval  5

[FILTER]
    Name                kubernetes
    Match               shieldops.*
    Kube_URL            https://kubernetes.default.svc:443
    Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
    Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
    Merge_Log           On

[OUTPUT]
    Name              cloudwatch_logs
    Match             shieldops.*
    region            us-gov-west-1
    log_group_name    /shieldops/application
    log_stream_prefix shieldops-
    auto_create_group true
