# ShieldOps — Alertmanager Routing Configuration
global:
  resolve_timeout: 5m
  slack_api_url: '<SLACK_WEBHOOK_URL>'

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'slack-default'
  routes:
    - match:
        severity: critical
      receiver: 'sns-critical'
    - match:
        severity: warning
      receiver: 'slack-default'

receivers:
  - name: 'slack-default'
    slack_configs:
      - channel: '#shieldops-alerts'
        title: 'ShieldOps Alert'
        text: '{{ .CommonAnnotations.summary }}'

  - name: 'sns-critical'
    webhook_configs:
      - url: '<SNS_WEBHOOK_URL>'
