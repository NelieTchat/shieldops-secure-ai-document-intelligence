# Local development only. Scrapes the sandbox stack started by scripts/local-stack.sh.
# In the cluster, ServiceMonitors replace this file (ADR 0013).
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts/shieldops.rules.yml

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["host.docker.internal:9090"]
  - job_name: llm-service
    static_configs:
      - targets: ["host.docker.internal:9103"]
  - job_name: ingestion-service
    static_configs:
      - targets: ["host.docker.internal:9102"]
  - job_name: document-processor
    static_configs:
      - targets: ["host.docker.internal:9101"]
