name: ShieldOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - llm-service
          - document-processor
          - ingestion-service
    defaults:
      run:
        working-directory: application/${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: actionlint (pinned by digest)
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - staging
          - production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Init without backend
        run: terraform init -backend=false -input=false
        working-directory: terraform/environments/${{ matrix.environment }}

      - name: Validate
        run: terraform validate
        working-directory: terraform/environments/${{ matrix.environment }}

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - llm-service
          - document-processor
          - ingestion-service
          - frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t shieldops/${{ matrix.service }}:ci application/${{ matrix.service }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks (pinned by digest)
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          detect --source /repo --redact --no-banner -v

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy vulnerabilities and misconfigurations (pinned by digest)
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/aquasecurity/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
          fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1
          --ignorefile /repo/.trivyignore.yaml --quiet /repo

  alert-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: promtool check rules (pinned by digest)
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/alerts:/w:ro"
          prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          check rules /w/shieldops.rules.yml

      - name: promtool test rules (unit tests for the alerts)
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/alerts:/w:ro"
          prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          test rules /w/shieldops.rules.test.yml

      - name: promtool unit tests (pinned by digest)
        run: >
          docker run --rm --entrypoint promtool
          -v "$PWD/observability/alerts:/w:ro"
          prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          test rules /w/shieldops.rules.test.yml
