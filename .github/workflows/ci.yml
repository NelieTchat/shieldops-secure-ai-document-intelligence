name: ShieldOps CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - llm-service
          - document-processor
    defaults:
      run:
        working-directory: application/${{ matrix.service }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: application/${{ matrix.service }}/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -q

  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - staging
          - production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Init without backend
        run: terraform init -backend=false -input=false
        working-directory: terraform/environments/${{ matrix.environment }}

      - name: Validate
        run: terraform validate
        working-directory: terraform/environments/${{ matrix.environment }}

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - llm-service
          - document-processor
          - ingestion-service
          - frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build image (no push)
        run: docker build -t shieldops/${{ matrix.service }}:ci application/${{ matrix.service }}
