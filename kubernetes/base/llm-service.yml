apiVersion: v1
kind: ServiceAccount
metadata:
  name: llm-service
  annotations:
    # Replaced per environment in the overlay (IRSA role created by Terraform).
    eks.amazonaws.com/role-arn: arn:aws-us-gov:iam::ACCOUNT_ID:role/REPLACE_IN_OVERLAY
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llm-service-config
data:
  AWS_REGION: us-gov-west-1
  HOST: 0.0.0.0
  # UNVERIFIED for GovCloud (roadmap #52). Replace before the first real deploy.
  GENERATION_MODEL_ID: REPLACE_AFTER_ROADMAP_52
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-service
    spec:
      serviceAccountName: llm-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llm-service
          image: shieldops/llm-service:replace-in-overlay
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: llm-service-config
          env:
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: internal-api-token
                  key: token
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: host
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: port
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: dbname
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: llm-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: llm-service
  ports:
    - name: http
      port: 8080
      targetPort: http
